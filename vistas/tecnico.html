<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Ayuda Técnica — Técnico</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<main>
  <h1>Vista de técnicos</h1>

  <section class="seccion" id="acceso" hidden>
    <h2>Acceso restringido</h2>
    <form id="formAcceso">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" required autocomplete="current-password">
      <button type="submit">Entrar</button>
      <p id="mensajeAcceso" class="error" role="status"></p>
    </form>
  </section>

  <div id="contenido" hidden>

  <section class="seccion">
    <h2>Técnicos</h2>
    <p class="muted">Selecciona un técnico para ver sus tickets.</p>
    <div id="listaTecnicos">Cargando técnicos...</div>

    <hr>
    <h3>Añadir técnico</h3>
    <form id="formTecnico">
      <label for="nombreTecnico">Nombre del técnico</label>
      <input type="text" id="nombreTecnico" required>
      <label for="especialidad">Especialidad</label>
      <input type="text" id="especialidad" required>
      <label for="estadoTecnico">Estado</label>
      <select id="estadoTecnico" required>
        <option value="Disponible">Disponible</option>
        <option value="Ocupado">Ocupado</option>
        <option value="Inactivo">Inactivo</option>
      </select>
      <button type="submit">Añadir técnico</button>
      <p id="mensaje" role="status"></p>
    </form>
  </section>

  <section class="seccion" id="panelTickets" hidden>
    <h2 id="tituloTickets"></h2>
    <div id="listaTickets" aria-live="polite"></div>
  </section>
    <button type="button" id="btnSalir" class="secundario">Cerrar sesión</button>
  </div>
</main>
<script src="/js/comun.js"></script>
<script src="/js/tecnico.js"></script>
</body>
</html>
